<section>
  <!-- Base form -->
  <form id="product-form">
    <div>
      <input type="text" id="product" name="product" placeholder="Product" />
    </div>
    <div>
      <select name="category" id="category">
        <option value="" disabled selected hidden>Category</option>
      </select>
      <input
        type="number"
        min="0"
        name="price"
        id="price"
        step="1"
        placeholder="Price"
      />
      <input
        type="number"
        name="amount"
        id="amount"
        placeholder="Amount"
        min="1"
        step="1"
      />
    </div>

    <button type="submit" class="button-primary">Add Product</button>
  </form>
</section>

<!-- Horizontal Line -->
<span class="horizontal-line"></span>

<section>
  <!-- Base Table -->
  <table>
    <thead>
      <th class="font-bold">Code</th>
      <th class="font-bold">Product</th>
      <th class="font-bold">Amount</th>
      <th class="font-bold">Unit price</th>
      <th class="font-bold">Category</th>
      <th class="font-bold">Action</th>
    </thead>
    <tbody id="tbody-products"></tbody>
  </table>
</section>
