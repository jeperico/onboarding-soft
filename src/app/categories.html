<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suite Store PDV - Categories</title>
    <link rel="stylesheet" href="./../styles/base.css" />
    <link rel="stylesheet" href="./../styles/components.css" />
    <link rel="stylesheet" href="./../styles/main.css" />
    <script type="module" src="./../build/services/category.js"></script>
    <script type="module" src="./../build/events/category.js"></script>
  </head>
  <body>
    <header>
      <a href="./home.html"><h1>Suite Store</h1></a>
      <nav>
        <ul>
          <li><a href="./products.html">Products</a></li>
          <li><a href="./categories.html">Categories</a></li>
          <li><a href="./history.html">History</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section>
        <!-- Base form -->
        <form id="category-form">
          <div>
            <input
              type="text"
              id="category"
              name="category"
              required
              placeholder="Category"
            />
            <input
              type="number"
              min="1"
              id="tax"
              name="tax"
              required
              placeholder="Tax"
            />
          </div>
          <button type="submit" class="button-primary">Add Category</button>
        </form>
      </section>
      <!-- Horizontal Line -->
      <span class="horizontal-line"></span>
      <!-- Base Table -->
      <section>
        <table>
          <thead>
            <th class="font-bold">Code</th>
            <th class="font-bold">Category</th>
            <th class="font-bold">Tax</th>
            <th class="font-bold">Action</th>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
