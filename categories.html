<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suite Store PDV - Categories</title>
    <link rel="stylesheet" href="./assets/styles/base.css" />
    <link rel="stylesheet" href="./assets/styles/components.css" />
    <link rel="stylesheet" href="./assets/styles/main.css" />
  </head>
  <body>
    <header>
      <h1>Categories</h1>
      <nav>
        <ul>
          <li><a href="./home.html">Home</a></li>
          <li><a href="./products.html">Products</a></li>
          <li><a href="./categories.html">Categories</a></li>
          <li><a href="./history.html">History</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section>
        <!-- Base form -->
        <form id="category-form">
          <div>
            <select name="category" id="category" required>
              <option value="" disabled selected hidden>Category</option>
              <option value="">Coffee</option>
              <option value="">Beans</option>
              <option value="">Rice</option>
            </select>
            <input
              type="number"
              min="1"
              name="tax"
              id="tax"
              placeholder="Tax"
              required
            />
          </div>
          <button type="submit" class="button-primary">Add Category</button>
        </form>
      </section>
      <!-- Horizontal Line -->
      <span class="horizontal-line"></span>
      <!-- Base Table -->
      <section>
        <table>
          <thead>
            <th class="font-bold">Code</th>
            <th class="font-bold">Category</th>
            <th class="font-bold">Tax</th>
          </thead>
          <tbody>
            <tr>
              <td>001</td>
              <td>Food</td>
              <td>10%</td>
            </tr>
            <tr>
              <td></td>
              <td></td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
