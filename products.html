<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suite Store PDV - Products</title>
    <link rel="stylesheet" href="./assets/styles/base.css" />
    <link rel="stylesheet" href="./assets/styles/components.css" />
    <link rel="stylesheet" href="./assets/styles/main.css" />
  </head>
  <body>
    <header>
      <a href="./home.html"><h1>Suite Store</h1></a>
      <nav>
        <ul>
          <li><a href="./products.html">Products</a></li>
          <li><a href="./categories.html">Categories</a></li>
          <li><a href="./history.html">History</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section>
        <!-- Base form -->
        <form id="product-form">
          <div>
            <input
              type="text"
              name="product"
              id="product"
              required
              placeholder="Product"
            />
          </div>
          <div>
            <select name="category" id="category" required>
              <option value="" disabled selected hidden>Category</option>
              <option value="">Coffee</option>
              <option value="">Beans</option>
              <option value="">Rice</option>
            </select>
            <input
              type="number"
              min="0"
              name="price"
              id="price"
              step="0.1"
              placeholder="Price"
              required
            />
            <input
              type="number"
              name="amount"
              id="amount"
              placeholder="Amount"
              min="1"
              step="1"
              required
            />
          </div>

          <button type="submit" class="button-primary">Add Product</button>
        </form>
      </section>
      <!-- Horizontal Line -->
      <span class="horizontal-line"></span>
      <section>
        <!-- Base Table -->
        <table>
          <thead>
            <th class="font-bold">Code</th>
            <th class="font-bold">Product</th>
            <th class="font-bold">Amount</th>
            <th class="font-bold">Unit price</th>
            <th class="font-bold">Category</th>
          </thead>
          <tbody>
            <tr>
              <td>001</td>
              <td>Rice</td>
              <td>10</td>
              <td>20.00</td>
              <td>Food</td>
              <td class="action-delete">
                <button>DELETE</button>
              </td>
            </tr>
            <tr>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
