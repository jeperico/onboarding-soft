<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suite Store PDV</title>
    <link rel="stylesheet" href="./assets/styles/base.css" />
    <link rel="stylesheet" href="./assets/styles/header.css" />
    <link rel="stylesheet" href="./assets/styles/main.css" />
  </head>
  <body>
    <header>
      <h1>Suite Store</h1>
      <nav>
        <ul>
          <li><a href="./home.html">Home</a></li>
          <li><a href="./products.html">Products</a></li>
          <li><a href="./categories.html">Categories</a></li>
          <li><a href="./history.html">History</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section>
        <!-- Base form -->
        <form id="home-form">
          <select name="product" id="product" required>
            <option value="" disabled selected hidden>Product</option>
            <option value="">Coffee</option>
            <option value="">Beans</option>
            <option value="">Rice</option>
          </select>
          <div>
            <input
              type="number"
              name="amount"
              id="amount"
              placeholder="Amount"
              min="1"
              step="1"
            />
            <input
              type="number"
              min="1"
              name="tax"
              id="tax"
              placeholder="Tax"
            />
            <input
              type="number"
              min="0"
              name="price"
              id="price"
              placeholder="Price"
            />
          </div>
          <button type="submit">Add Product</button>
        </form>
      </section>
      <!-- Horizontal Line -->
      <span id="horizontal-line"></span>
      <!-- Cart Division -->
      <section>
        <!-- Base Table -->
        <table id="home-table">
          <thead>
            <th>Product</th>
            <th>Tax</th>
            <th>Price</th>
            <th>Amount</th>
            <th>Total</th>
          </thead>
          <tbody>
            <tr>
              <td>Rice</td>
              <td>$2.00</td>
              <td>$20.0</td>
              <td>2</td>
              <td>40.00</td>
            </tr>
          </tbody>
        </table>
        <!-- Finish buy form -->
        <form action="">
          <div>
            <label for="total-tax">Tax</label>
            <input type="number" name="total-tax" id="total-tax" disabled />
          </div>
          <div>
            <label for="total">Total</label>
            <input type="number" name="total" id="total" disabled />
          </div>
          <div>
            <button>Cancel</button>
            <button type="submit">Finish</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
