<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suite Store PDV</title>
  </head>
  <body>
    <header>
      <h1>Suite Store</h1>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Products</a></li>
          <li><a href="#">Categories</a></li>
          <li><a href="#">History</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <!-- Base form -->
      <form>
        <div>
          <label for="product">Product</label>
          <select name="product" id="product"></select>
        </div>
        <div>
          <label for="amount">Amount</label>
          <input type="number" name="amount" id="amount" />
        </div>
        <div>
          <label for="tax">Tax value</label>
          <input type="number" name="tax" id="tax" disabled />
        </div>
        <div>
          <label for="price">Unit price</label>
          <input type="number" name="price" id="price" disabled />
        </div>
        <button type="submit">Add Product</button>
      </form>
      <!-- Base Table -->
      <table>
        <thead>
          <th>Product</th>
          <th>Unit price</th>
          <th>Amount</th>
          <th>Total</th>
          <th></th>
        </thead>
        <tbody>
          <tr>
            <td>Rice</td>
            <td>$20.0</td>
            <td>2</td>
            <td>40.00</td>
            <td>
              <button>Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
      <!-- Finish buy form -->
      <form action="">
        <div>
          <label for="total-tax">Tax</label>
          <input type="number" name="total-tax" id="total-tax" disabled />
        </div>
        <div>
          <label for="total">Total</label>
          <input type="number" name="total" id="total" disabled />
        </div>
        <div>
          <button>Cancel</button>
          <button type="submit">Finish</button>
        </div>
      </form>
    </main>
  </body>
</html>
