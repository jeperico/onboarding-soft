<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suite Store PDV</title>
    <link rel="stylesheet" href="./assets/styles/base.css" />
    <link rel="stylesheet" href="./assets/styles/components.css" />
    <link rel="stylesheet" href="./assets/styles/main.css" />
  </head>
  <body>
    <header>
      <h1>Suite Store</h1>
      <nav>
        <ul>
          <li><a href="./home.html">Home</a></li>
          <li><a href="./products.html">Products</a></li>
          <li><a href="./categories.html">Categories</a></li>
          <li><a href="./history.html">History</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section>
        <!-- Base form -->
        <form id="home-form">
          <select name="product" id="product" required>
            <option value="" disabled selected hidden>Product</option>
            <option value="">Coffee</option>
            <option value="">Beans</option>
            <option value="">Rice</option>
          </select>
          <div>
            <input
              type="number"
              name="amount"
              id="amount"
              placeholder="Amount"
              min="1"
              step="1"
              required
            />
            <input
              type="number"
              min="1"
              name="tax"
              id="tax"
              placeholder="Tax"
              required
            />
            <input
              type="number"
              min="0"
              name="price"
              id="price"
              step="0.1"
              placeholder="Price"
              required
            />
          </div>
          <button type="submit" class="button-primary">Add Product</button>
        </form>
      </section>
      <!-- Horizontal Line -->
      <span class="horizontal-line"></span>
      <!-- Cart Division -->
      <section id="chart-section">
        <!-- Base Table -->
        <table>
          <thead>
            <th class="font-bold">Product</th>
            <th class="font-bold">Tax</th>
            <th class="font-bold">Price</th>
            <th class="font-bold">Amount</th>
            <th class="font-bold">Total</th>
          </thead>
          <tbody>
            <tr>
              <td>Rice</td>
              <td>$2.00</td>
              <td>$20.0</td>
              <td>2</td>
              <td>40.00</td>
            </tr>
            <tr>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
            </tr>
          </tbody>
        </table>
        <!-- Finish buy form -->
        <form id="chart-details">
          <div>
            <div>
              <p class="font-bold">Tax</p>
              <p class="font-bold">Total:</p>
            </div>
            <div>
              <p>$6.50</p>
              <p>$32.50</p>
            </div>
          </div>
          <div>
            <button class="button-secondary">Cancel</button>
            <button type="submit" class="button-primary">Finish</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
